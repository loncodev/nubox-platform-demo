.home{min-height:calc(100vh - 43px);display:grid;grid-template-columns:235px 1fr}.sidebar{background:white;border-right:1px solid var(--line);padding:31px 19px;display:flex;flex-direction:column;gap:32px}.side-nav{display:grid;gap:7px}.navbtn{border:0;background:none;text-align:left;padding:12px 13px;color:#68778d;border-radius:9px;font-weight:600;display:flex;gap:10px;align-items:center}.navbtn:hover,.navbtn.active{background:#edf3ff;color:#2456b0}.navbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.side-note{margin-top:auto;padding:16px;background:#f4f7fd;border-radius:10px;color:#536685;font-size:12px;line-height:1.55}.workspace{min-width:0}.topbar{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,55px);gap:15px}.company-picker{position:relative}.picker{border:1px solid #dee5f0;border-radius:10px;background:#fff;padding:10px 13px;min-width:257px;text-align:left;display:flex;align-items:center;gap:11px}.avatar{background:#eaf1ff;color:#3666a5;width:36px;height:36px;display:grid;place-items:center;border-radius:9px;font-weight:850}.picker-txt{flex:1;font-weight:700;font-size:13px}.picker-txt small{display:block;color:#8490a5;font-size:10px;font-weight:500;margin-top:3px}.chevron{font-size:12px;color:#7e8b9d}.company-menu{position:absolute;top:57px;left:0;background:white;border:1px solid #dce4f0;box-shadow:var(--shadow);border-radius:10px;width:315px;z-index:10;padding:6px}.company-item{border:0;background:white;text-align:left;width:100%;display:flex;gap:10px;align-items:center;padding:11px;border-radius:8px}.company-item:hover{background:#edf3ff}.company-item small{display:block;color:#8190a4;font-size:11px;margin-top:2px}.userpill{display:flex;gap:10px;align-items:center;font-size:12px;color:#60718b}.userpill .avatar{background:#1f2a46;color:white;border-radius:50%}.page{padding:clamp(24px,4vw,55px);max-width:1300px;margin:auto}.eyebrow{font-size:12px;text-transform:uppercase;color:#5578ba;letter-spacing:.13em;font-weight:850}.page h1{font-size:clamp(30px,3.1vw,42px);margin:10px 0 8px;letter-spacing:-.035em}.sub{color:#718097;line-height:1.6;margin:0 0 24px}.info-banner{background:#edf2fa;border-radius:11px;padding:17px 20px;display:flex;gap:12px;align-items:center;font-size:14px;color:#56637b;margin-bottom:26px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#13cf68;flex-shrink:0}.grid-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.product{border:1px solid #e6eaf2;background:white;border-radius:11px;padding:20px;min-height:185px;text-align:left;box-shadow:0 5px 16px rgba(25,41,79,.04);display:flex;flex-direction:column;align-items:flex-start}.product:not(:disabled):hover{border-color:#9fbbf3;transform:translateY(-2px);box-shadow:0 12px 28px rgba(25,41,79,.1)}.product:disabled{opacity:.43;cursor:not-allowed}.product .stripe{height:4px;width:30px;background:var(--c);border-radius:6px;margin-bottom:16px}.product .letters{font-size:38px;font-weight:850;line-height:1}.product .caption{font-size:13px;line-height:1.33;margin:6px 0 19px;font-weight:700;color:#2a344c}.product .foot{font-size:11px;color:#3266c6;font-weight:750;margin-top:auto}.product.disabled .foot{color:#8995a6}.panel{background:white;border:1px solid #e2e8f2;border-radius:13px;padding:23px;box-shadow:0 5px 15px #1b2b4b08;margin-top:18px}.panel h3{margin:0 0 8px;font-size:18px}.panel p{color:#738197;font-size:13px;line-height:1.55}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px;margin-top:22px}.quick{border:1px solid #e0e8f3;border-radius:12px;background:#fff;padding:20px;text-align:left}.quick:hover{border-color:#a5c2f7}.quick strong{display:block;margin-bottom:6px}.quick small{color:#75849a;line-height:1.45}.pill{border-radius:999px;font-size:11px;font-weight:700;padding:5px 9px;color:#136942;background:#e7f9ee;display:inline-block}.pill.neutral{background:#edf3ff;color:#355b9a}.product-page{display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 78px)}.product-nav{background:#fbfcff;border-right:1px solid var(--line);padding:25px 17px}.product-nav h4{margin:0 0 15px}.fakechart{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:130px;gap:10px;border-bottom:1px solid #d2d9e8;padding:8px 10px 0}.bar{background:linear-gradient(180deg,#6d98ea,#c6d7ff);border-radius:7px 7px 0 0}.settings-row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #e5ebf5;padding:16px 0;font-size:13px}.toast{position:fixed;right:20px;bottom:22px;z-index:40;background:var(--navy);color:white;padding:14px 18px;border-radius:10px;box-shadow:var(--shadow);max-width:min(440px,calc(100vw - 40px));font-size:13px;line-height:1.5;animation:popin .2s ease-out}@keyframes popin{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}.devbox{border:1px dashed #a8b9d5;border-radius:10px;background:#f7faff;padding:15px;margin-top:21px;color:#516887;font-size:12px;line-height:1.5}.btn-inline{border:1px solid #cad5e6;background:white;border-radius:8px;padding:10px 15px;font-weight:700;color:#284577}.btn-inline:hover{background:#f1f5ff}.primary-inline{background:#213050;color:white;border:1px solid #213050}.primary-inline:hover{background:#152138}.alert-compact{background:#fff8e6;border-left:4px solid #f3ba49;padding:12px 15px;color:#856224;border-radius:5px;margin:18px 0;font-size:13px}.route-crumb{font-size:12px;color:#8e9bb0;margin-bottom:18px}.footnote{margin-top:30px;font-size:11px;color:#8291a6;line-height:1.55}
@media(max-width:800px){.auth-shell{grid-template-columns:1fr}.auth-aside{padding:24px 26px;min-height:230px}.auth-aside h1{font-size:30px;margin:10px 0}.auth-aside p{font-size:14px}.aside-bottom,.mini-products{display:none}.auth-main{padding:34px 23px}.auth-card h2{font-size:27px}.home{grid-template-columns:1fr}.sidebar{padding:14px 16px;gap:10px;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;justify-content:space-between}.sidebar .side-note{display:none}.side-nav{display:flex;flex-wrap:wrap}.navbtn{font-size:12px;padding:9px}.topbar{height:auto;min-height:68px;padding:12px 16px}.company-picker .picker{min-width:190px}.userpill span{display:none}.page{padding:23px 17px}.product-page{grid-template-columns:1fr}.product-nav{display:none}.demo{padding:8px 12px}.demo .tag{display:none}}
.mock-secret{border:1px solid #dce4ef;background:#f4f6fa;padding:13px 15px;border-radius:8px;font-size:17px;letter-spacing:3px;user-select:none;color:#697990;max-width:460px}button:disabled{opacity:.5;cursor:not-allowed}
.product.preview{opacity:1;border-style:dashed;background:#f8fbff}.product.preview .foot{color:var(--blue)}.extra-actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:19px}.settings-row{flex-wrap:wrap}.settings-row .btn-inline{font-size:12px;padding:8px 10px}@media(max-width:800px){.side-nav{gap:3px}.side-nav .navbtn{font-size:11px;padding:8px}}
.cutoff{border-left:4px solid #f0b749;border-radius:8px;background:#fff8e9;padding:13px 16px;margin:17px 0 22px;color:#725624;line-height:1.4}.cutoff strong{display:block;font-size:13px}.cutoff span{display:block;margin:7px 0;font-size:12px}.cutoff .linkbtn{font-size:12px}.extra-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* Ayuda contextual compacta: hover/foco en escritorio; toque/clic en móvil */
.help-wrap{display:inline-flex;vertical-align:middle;position:relative;align-items:center;margin-left:5px;font-size:14px;line-height:1}
.help-trigger{width:21px;height:21px;border-radius:50%;border:1px solid #87a2ca;background:#f4f8ff;color:#2857a5;font-weight:800;font-size:12px;display:inline-grid;place-items:center;cursor:help;line-height:1;padding:0}
.help-trigger:hover,.help-trigger:focus-visible,.help-wrap.is-open .help-trigger{background:#e3efff;color:#1c4079;border-color:#4c7fcb}
.help-popover{position:absolute;z-index:200;width:min(305px,calc(100vw - 45px));right:-8px;top:calc(100% + 10px);background:#202a44;color:#fff;font:400 12.5px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;letter-spacing:normal;text-align:left;white-space:normal;padding:12px 14px;border-radius:10px;box-shadow:0 12px 34px #18233e35;opacity:0;visibility:hidden;transform:translateY(-4px);pointer-events:none;transition:opacity .12s,transform .12s,visibility .12s}
.help-wrap.is-open .help-popover,.help-wrap:focus-within .help-popover{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}
@media(hover:hover) and (pointer:fine){.help-wrap:hover .help-popover{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto}}
@media(max-width:600px){.help-wrap .help-popover{position:fixed;left:16px;right:16px;top:auto;bottom:18px;width:auto;max-width:none;z-index:260;font-size:14px;line-height:1.5;padding:16px}}

/* Herramientas de presentación discretas, sin cabecera interpuesta */
.prototype-utilities{position:fixed;z-index:180;right:14px;bottom:12px;display:flex;align-items:center;gap:11px;padding:7px 10px;background:rgba(255,255,255,.94);color:#8390a5;border:1px solid #e4e9f3;border-radius:999px;box-shadow:0 4px 18px rgba(18,35,68,.05);font-size:10px;letter-spacing:.01em}
.prototype-utilities button{border:0;border-left:1px solid #d8e1ee;padding:2px 2px 2px 10px;background:none;color:#61748f;font-size:11px;font-weight:600}
.prototype-utilities button:hover,.prototype-utilities button:focus-visible{color:#2354a3}
@media(max-width:600px){.prototype-utilities{right:8px;bottom:7px;font-size:10px;padding:6px 9px}}
</style>

<body>
<div class="prototype-utilities"><span>Prototipo interactivo · Datos ilustrativos</span><button id="reset" type="button" aria-label="Reiniciar recorrido del prototipo">Reiniciar ↻</button></div>
<main id="app"></main>
<script src="extras.js"></script>
<script src="identity.js"></script>
<script>
(() => {
'use strict';
const app=document.getElementById('app');
const state={screen:'login',email:'andres@empresa.cl',rut:'',verifiedEmail:'andres@empresa.cl',trust:false,agree1:false,agree2:false,company:0,menuOpen:false,chosenProduct:'CO',migrating:false,returnTo:'home',passwordChanged:false,sessionsClosed:false,mfaConfigured:false,consented:false,pendingEmail:'',previousEmail:'',toast:''};
const companies=[{name:'Comercial Andes SpA',rut:'76.348.950-2',products:['FA','CO','RE','PO']},{name:'Estudio Cordillera',rut:'77.104.221-0',products:['FA','CO','RE','CA']},{name:'Servicios del Sur',rut:'76.920.385-6',products:['FA','CO']}];
const productInfo={FA:{name:'Factura y Administración',color:'#ff6235'},CO:{name:'Contabilidad',color:'#20d55f'},RE:{name:'Remuneraciones',color:'#7b80c5'},PO:{name:'Portal de Colaboradores',color:'#347aff'},CA:{name:'Control de Asistencia',color:'#c9b2df'}};
const icons={home:'<svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg>',apps:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',users:'<svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3"/><path d="M18 8a3 3 0 0 1 0 6M17 17a5 5 0 0 1 4 4"/></svg>',shield:'<svg viewBox="0 0 24 24"><path d="m12 2 8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="m8 12 3 3 5-6"/></svg>',credit:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>'};
const escape=s=>String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const extra=window.NuboxExtras({state,companies,productInfo,shell,escape,setScreen,toast,help});
const identity=window.NuboxIdentity({state,escape,aside,wrap,shell,setScreen,toast,help});

const HELP_TEXT={
 why:'Nubox propone avanzar hacia un acceso común a sus cinco productos. Usar correo como identificador simplifica el ingreso, pero la protección proviene del segundo factor y de los controles de seguridad, no del correo por sí solo.',
 deadline:'15 de febrero de 2027 es una fecha únicamente ilustrativa de esta entrevista; Nubox no la ha anunciado. El calendario definitivo debería definirse por cohortes y comunicarse con anticipación.',
 migration:'Verificar el correo nuevo confirma que puedes recibir mensajes allí, pero no demuestra que seas titular del usuario que ingresaba con RUT. La identidad anterior requiere una comprobación separada.',
 emailcode:'Este código ficticio sirve para comprobar el correo durante la migración. No es el segundo factor del ingreso.',
 mfa:'Al configurar MFA por primera vez registras un factor independiente de tu correo, por ejemplo una aplicación autenticadora. En esta demo no se vincula una aplicación real.',
 mfalogin:'Los accesos siguientes usan el factor ya configurado. No deberías repetir la configuración o los consentimientos en cada ingreso.',
 trust:'La confianza de 30 días es un supuesto inspirado en el video. Seguridad debe validar duración, excepciones, dispositivos compartidos y operaciones sensibles.',
 password:'La contraseña de Nubox y la de Gmail u Outlook son independientes. El cambio afectaría a productos integrados y podría revocar otras sesiones, según la política aprobada.',
 emailchange:'El nuevo correo se verifica solo después de revalidar la identidad con un factor existente. Cambiar de correo conserva la identidad interna, las empresas y los permisos.',
 recovery:'Si perdiste el buzón o el segundo factor, la recuperación no puede omitir la comprobación de titularidad. Se propone una vía segura asistida por Soporte.',
 permissions:'La administración de permisos por empresa y producto es otra iniciativa del portafolio. Los permisos y usuarios mostrados aquí son ficticios.',
 future:'Esta sección muestra la visión futura de Plataforma Nubox y queda fuera del alcance del primer proyecto de login único y MFA.',
 billing:'Los documentos, fechas, medios de pago y montos son ficticios. La versión real debe consumir los datos de facturación y pagos de Nubox.',
 terms:'Los documentos mostrados son marcadores de posición; no son los términos o avisos de privacidad reales de Nubox.'
};
let helpSerial=0;
function help(key,label='Más información'){
 const id='nubox-help-'+(++helpSerial);
 const copy=HELP_TEXT[key]||HELP_TEXT.future;
 return '<span class="help-wrap"><button type="button" class="help-trigger" aria-label="'+escape(label)+'" aria-describedby="'+id+'" aria-expanded="false" aria-controls="'+id+'" data-help-trigger title="'+escape(label)+'">?</button><span class="help-popover" role="tooltip" id="'+id+'">'+escape(copy)+'</span></span>';
}
function closeHelp(){
 document.querySelectorAll('.help-wrap.is-open').forEach(node=>{node.classList.remove('is-open');const b=node.querySelector('.help-trigger');if(b)b.setAttribute('aria-expanded','false')});
}
document.addEventListener('click',event=>{
 const btn=event.target.closest('.help-trigger');
 if(btn){
  const wrapper=btn.closest('.help-wrap');const opening=!wrapper.classList.contains('is-open');
  closeHelp();wrapper.classList.toggle('is-open',opening);btn.setAttribute('aria-expanded',String(opening));
  event.stopPropagation();
 }else if(!event.target.closest('.help-popover'))closeHelp();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeHelp();if(document.activeElement?.classList?.contains('help-trigger'))document.activeElement.blur();}});
function brand(light=false){return `<div class="brand ${light?'light':''}">nubox</div>`}
function aside(kicker,head,desc){return `<aside class="auth-aside"><div>${brand(true)}</div><div><div class="aside-kicker">PLATAFORMA NUBOX · ${kicker}</div><h1>${head}</h1><p>${desc}</p><div class="mini-products">${Object.keys(productInfo).map(s=>`<span>${s}</span>`).join('')}</div></div><div class="aside-bottom">Una cuenta · Tus empresas · Todos tus productos</div></aside>`}
function wrap(authAside,content){return `<div class="auth-shell">${authAside}<section class="auth-main"><div class="auth-card">${brand()}${content}</div></section></div>`}
function toast(msg){let t=document.getElementById('toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{if(t&&t.parentNode)t.remove()},3600)}
function setScreen(name){state.screen=name;state.menuOpen=false;render();window.scrollTo({top:0,behavior:'instant'})}
function login(){return wrap(aside('Ingreso','Un solo ingreso, con tu correo.','El correo verificado reemplaza al RUT como dato de acceso. Tu relación con cada empresa se conserva.'),`<h2>Ingresa a Nubox ${help('why','¿Por qué cambia el ingreso?')}</h2><p class="lead">Una sola cuenta para todos tus productos.</p><div class="cutoff"><strong>Ingreso con RUT: fecha de corte ilustrativa, 15 de febrero de 2027 ${help('deadline','Sobre la fecha de corte')}</strong><span>¿Todavía ingresas con RUT? Actualiza tu acceso antes del plazo que Nubox comunique oficialmente.</span><button class="linkbtn" type="button" data-action="migrationInfo">Ver guía de migración</button></div><form id="loginform"><label class="field" for="email">Correo electrónico</label><input class="text-input" type="email" id="email" autocomplete="email" required value="${escape(state.email)}" placeholder="nombre@empresa.cl"><div class="aux"><button class="linkbtn" type="button" data-action="recover">¿No puedo ingresar?</button></div><button class="action" type="submit">Continuar</button></form><div class="divider-text">o</div><button class="action secondary" type="button" data-action="rut">Antes ingresaba con RUT</button>`)}
function migrate(){return wrap(aside('Migración','De RUT a correo, sin perder tu cuenta.','Un paso de transición que conserva la identidad y los permisos que ya tenías.'),`<h2>Actualiza tu ingreso ${help('migration','Sobre la vinculación de identidad')}</h2><p class="lead">Asociemos tu cuenta actual a un correo que puedas verificar.</p><div class="cutoff"><strong>Fecha ilustrativa: 15 de febrero de 2027 ${help('deadline','Sobre el plazo')}</strong><span>Nubox comunicará la fecha oficial. Necesitarás comprobar tu identidad anterior.</span></div><form id="migrateform"><label class="field" for="rut">RUT que usabas para ingresar</label><input class="text-input" id="rut" value="${escape(state.rut||'12.345.678-9')}" placeholder="12.345.678-9" required><label class="field" for="newemail">Tu correo individual</label><input class="text-input" type="email" id="newemail" value="${escape(state.email)}" placeholder="nombre@empresa.cl" required><p class="tiny">Conservaremos tus empresas y permisos una vez validada la identidad anterior. ${help('migration','Por qué se comprueba la identidad')}</p><button class="action" type="submit">Continuar y verificar correo</button></form><div class="aux"><button class="linkbtn" data-action="login">Volver al ingreso</button><button class="linkbtn" data-action="noaccess">No puedo verificar mis datos</button></div>`)}
function contactVerification(){return wrap(aside('Datos de contacto','Tus datos, con tu permiso.','Verificamos el correo antes de usarlo para el nuevo inicio de sesión.'),`<h2>Verifica tu correo ${help('emailcode','Para qué sirve este código')}</h2><p class="lead">Enviamos un código de demostración a <strong>${escape(state.email)}</strong>.</p><label class="field" for="emailcode">Código de verificación</label><input class="text-input code" id="emailcode" maxlength="6" inputmode="numeric" placeholder="••••••" aria-label="Código de verificación de correo"><div class="info">Código de prueba: <strong>482915</strong>.</div><button class="action" data-action="verifycontact">Verificar correo</button><div class="aux"><button class="linkbtn" data-action="resend">Reenviar código</button><button class="linkbtn" data-action="noaccess">No tengo acceso al correo</button></div>`)}
function recovery(){return wrap(aside('Recuperación','Un acceso seguro también debe ser recuperable.','Cuando el usuario no controla el correo o la credencial, la solución exige un mecanismo alternativo verificado.'),`<h2>Necesitas ayuda para ingresar</h2><p class="lead">Para evitar cambios de correo fraudulentos, la recuperación requiere comprobación adicional de titularidad.</p><div class="alert-compact">Escenario excepcional: correo desactualizado o inaccesible.</div><div class="panel"><h3>Recuperación asistida</h3><p>En una implementación real, Nubox definiría con Seguridad y Soporte un procedimiento de recuperación. No corresponde habilitar cambios de correo sin controles de identidad.</p><button class="btn-inline primary-inline" data-action="support">Simular solicitud a soporte</button></div><button class="action secondary" data-action="login">Volver al inicio</button>`)}
function mfa(){const em=escape(state.email);return wrap(aside('Seguridad','Seguro, sin fricción.','Segundo factor y opción de dispositivo confiable por 30 días, como muestra el video.'),`<h2>Verifica que eres tú</h2><p class="lead">Te enviamos un código de acceso a <strong>${em}</strong>.</p><label class="field" for="otp">Código de verificación</label><input class="text-input code" id="otp" maxlength="6" inputmode="numeric" placeholder="••••••" aria-label="Código de segundo factor"><label class="toggle-row"><input type="checkbox" id="trust" ${state.trust?'checked':''}><span><strong style="display:block;font-size:13px">Confiar en este dispositivo</strong><small class="tiny">No pedir el código durante 30 días en este equipo (supuesto a validar).</small></span></label><button class="action" data-action="verifymfa">Verificar</button><div class="aux"><button class="linkbtn" data-action="resend">Reenviar código</button><span class="tiny">Código de verificación: <strong>482915</strong></span></div><div class="info">El video muestra el código enviado por correo; el método final y la política de dispositivo confiable deberán ser aprobados por Seguridad.</div>`)}
function consent(){return wrap(aside('Consentimientos','Tus datos, con tu permiso.','Términos versionados y aceptados dentro del mismo ingreso.'),`<h2>Actualizamos nuestros términos ${help('terms','Sobre estos documentos')}</h2><p class="lead">Revisa y acepta los documentos necesarios para continuar con la plataforma.</p><label class="consent"><input type="checkbox" id="consent1" ${state.agree1?'checked':''}><div><strong>Términos y condiciones</strong></div><span style="color:#577bd0">↗</span></label><label class="consent"><input type="checkbox" id="consent2" ${state.agree2?'checked':''}><div><strong>Política de privacidad</strong></div><span style="color:#577bd0">↗</span></label><button class="action" data-action="accept">Aceptar y continuar</button>`)}
function menuButton(route,label,ico){return `<button class="navbtn ${state.screen===route?'active':''}" data-action="page" data-page="${route}">${icons[ico]}<span>${label}</span></button>`}
function shell(body){const c=companies[state.company];return `<div class="home"><aside class="sidebar">${brand()}<nav class="side-nav">${menuButton('home','Mi plataforma','home')}${menuButton('products','Mis productos','apps')}${menuButton('subscriptions','Mis suscripciones','credit')}${menuButton('catalog','Contratar planes','apps')}${menuButton('billing','Facturas y pagos','credit')}${menuButton('members','Usuarios y accesos','users')}${menuButton('security','Seguridad','shield')}${menuButton('account','Mi cuenta','users')}</nav><div class="side-note"><strong>Una sola experiencia Nubox</strong><br>Proyecto P0: ingreso unificado y MFA. Planes, cobros y usuarios representan una visión futura.</div></aside><div class="workspace"><header class="topbar"><div class="company-picker"><button class="picker" data-action="companymenu"><span class="avatar">${c.name[0]}</span><span class="picker-txt">${escape(c.name)}<small>RUT ${escape(c.rut)}</small></span><span class="chevron">▾</span></button>${state.menuOpen?`<div class="company-menu">${companies.map((co,i)=>`<button class="company-item" data-action="company" data-index="${i}"><span class="avatar">${co.name[0]}</span><span><strong>${escape(co.name)}</strong><small>${escape(co.rut)} ${i===state.company?' · seleccionada':''}</small></span></button>`).join('')}</div>`:''}</div><div class="userpill"><span>Andrés · Cuenta verificada</span><div class="avatar">A</div></div></header>${body}</div></div>`}
function prodCard(code,enabled){const p=productInfo[code];return `<button class="product ${!enabled?'preview':''}" style="--c:${p.color}" data-action="${enabled?'product':'extra-offer'}" data-code="${code}"><span class="stripe"></span><span class="letters">${code}</span><span class="caption">${p.name}</span><span class="foot">${enabled?'Abrir producto ↗':'Conocer plan →'}</span></button>`}
function home(){const c=companies[state.company];return shell(`<div class="page"><div class="eyebrow">La Plataforma Nubox · Cuenta</div><h1>Hola, Andrés</h1><p class="sub">Estos son tus productos en <strong>${escape(c.name)}</strong>.</p><div class="info-banner"><span class="dot"></span><span>Continúa donde quedaste: <strong>Contabilidad · Cierre de septiembre</strong></span><button class="btn-inline" style="margin-left:auto" data-action="product" data-code="CO">Continuar</button></div><h3 style="margin:0 0 16px">Tus productos</h3><div class="grid-products">${Object.keys(productInfo).map(code=>prodCard(code,extra.active(code))).join('')}</div><div class="quick-grid"><button class="quick" data-action="page" data-page="subscriptions"><strong>📋 Suscripciones</strong><small>Planes y renovaciones.</small></button><button class="quick" data-action="page" data-page="catalog"><strong>➕ Explorar planes</strong><small>Explorar otras soluciones.</small></button><button class="quick" data-action="page" data-page="billing"><strong>💳 Facturas y pagos</strong><small>Historial y medios de pago.</small></button><button class="quick" data-action="page" data-page="members"><strong>👥 Usuarios y accesos</strong><small>Gestiona tu equipo.</small></button><button class="quick" data-action="page" data-page="security"><strong>🔒 Seguridad de cuenta</strong><small>Verifica tus datos y revisa tu segundo factor.</small></button><button class="quick" data-action="page" data-page="account"><strong>👥 Mi cuenta</strong><small>Consulta tus empresas y datos de perfil.</small></button></div></div>`)}
function products(){const c=companies[state.company];return shell(`<div class="page"><div class="eyebrow">La Plataforma Nubox · Productos</div><h1>Mis productos</h1><p class="sub">Un acceso, cinco productos. Tus autorizaciones dependen de la empresa seleccionada.</p><div class="grid-products">${Object.keys(productInfo).map(code=>prodCard(code,extra.active(code))).join('')}</div></div>`)}
function security(){return shell(`<div class="page"><div class="eyebrow">Mi cuenta · Seguridad</div><h1>Seguridad de tu cuenta ${help('password','Cómo se relaciona con tu correo')}</h1><p class="sub">Administra el acceso y la protección de tu cuenta.</p><div class="panel"><h3>Estado del acceso <span class="pill">Protegido</span></h3><div class="settings-row"><span>Correo verificado</span><strong>${escape(state.email)}</strong></div><div class="settings-row"><span>Segundo factor</span><span class="pill">Activo</span></div><div class="settings-row"><span>Dispositivo de confianza</span><strong>${state.trust?'Habilitado por 30 días':'No habilitado'}</strong></div><div class="settings-row"><span>Contraseña</span><strong>${state.passwordChanged?'Actualizada':'Gestionada por Nubox'}</strong></div><div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn-inline primary-inline" data-action="changePassword">Cambiar contraseña</button><button class="btn-inline" data-action="changeEmail">Cambiar correo de ingreso</button><button class="btn-inline" data-action="sessions">Sesiones y dispositivos</button><button class="btn-inline" data-action="repeatmfa">Probar de nuevo MFA</button><button class="btn-inline" data-action="logout">Cerrar sesión</button></div></div><p class="tiny" style="margin-top:14px">Tu cuenta y los accesos a productos aún en transición pueden utilizar mecanismos diferentes. ${help('password','Contraseña Nubox y contraseña del correo')}</p></div>`)}
function account(){const c=companies[state.company];return shell(`<div class="page"><div class="eyebrow">Mi cuenta · Perfil</div><h1>Mi cuenta</h1><p class="sub">Información de tu cuenta y empresas vinculadas.</p><div class="panel"><h3>Perfil</h3><div class="settings-row"><span>Nombre</span><strong>Andrés Rojas</strong></div><div class="settings-row"><span>Correo de ingreso</span><strong>${escape(state.email)}</strong></div><div class="settings-row"><span>Empresa activa</span><strong>${escape(c.name)}</strong></div><div class="settings-row"><span>Empresas disponibles</span><strong>${companies.length}</strong></div></div><p class="tiny" style="margin-top:18px">Otras secciones representan la visión futura y no el primer proyecto. ${help('future','Alcance del business case')}</p></div>`)}
function product(){const c=companies[state.company],p=productInfo[state.chosenProduct];return shell(`<div class="product-page"><aside class="product-nav"><div style="font-weight:900;font-size:28px;border-top:5px solid ${p.color};display:inline-block;padding-top:5px">${state.chosenProduct}</div><h4>${p.name}</h4><button class="navbtn active" data-action="none">${icons.home} Resumen</button><button class="navbtn" data-action="none">${icons.apps} Actividad</button><button class="navbtn" data-action="none">${icons.users} Configuración</button><button class="navbtn" style="margin-top:24px" data-action="page" data-page="home">← Volver a Plataforma</button></aside><section class="page"><div class="route-crumb">Plataforma Nubox &gt; ${escape(c.name)} &gt; ${escape(p.name)}</div><div class="eyebrow">${state.chosenProduct} · Resumen</div><h1>${p.name}</h1><p class="sub">Accediste sin introducir credenciales nuevamente. La navegación conserva la empresa seleccionada.</p><div class="panel"><h3>Resumen de septiembre </h3><p>Consulta la actividad general de este producto.</p><div class="fakechart">${[64,90,43,78,56].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><button class="btn-inline" style="margin-top:20px" data-action="page" data-page="home">← Volver a mis productos</button></section></div>`)}
function changePassword(){return shell('<div class="page"><div class="eyebrow">Mi cuenta · Seguridad · Contraseña</div><h1>Cambiar contraseña '+help('password','Efectos de cambiar tu contraseña')+'</h1><p class="sub">Una sola operación para los productos integrados al acceso común.</p><div class="panel"><h3>1. Confirma el cambio</h3><label class="field">Contraseña actual (ejemplo)</label><div class="mock-secret" aria-label="Contraseña actual simulada">••••••••••</div><label class="field">Nueva contraseña (ejemplo)</label><div class="mock-secret" aria-label="Nueva contraseña simulada">••••••••••••</div><label class="field">Confirmar nueva contraseña (ejemplo)</label><div class="mock-secret" aria-label="Confirmación simulada">••••••••••••</div><button class="btn-inline primary-inline" data-action="startPasswordMfa">Continuar a verificación MFA →</button> <button class="btn-inline" data-action="page" data-page="security">Cancelar</button></div></div>')}
function changePasswordMfa(){return shell('<div class="page"><div class="eyebrow">Mi cuenta · Seguridad · Confirmación</div><h1>Confirma que eres tú</h1><p class="sub">Antes de cambiar la contraseña pedimos una comprobación adicional de identidad.</p><div class="panel"><h3>2. Verificación MFA</h3><p>Introduce el código ficticio <strong>482915</strong>. No se envía ningún correo ni SMS real.</p><label class="field" for="pwotp">Código de verificación</label><input class="text-input code" id="pwotp" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="••••••"><div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn-inline primary-inline" data-action="finishPasswordChange">Confirmar cambio de contraseña</button><button class="btn-inline" data-action="page" data-page="security">Cancelar</button></div></div><div class="devbox">Este paso supone que Seguridad aprueba una revalidación adicional. El método y la política exactos requieren definición.</div></div>')}
function passwordChanged(){return shell('<div class="page"><div class="eyebrow">Mi cuenta · Seguridad · Resultado</div><h1>Contraseña actualizada</h1><p class="sub">Cambio completado en la simulación.</p><div class="panel"><h3>✓ Cambio confirmado <span class="pill">Simulado</span></h3><div class="settings-row"><span>Productos ya integrados</span><strong>Usarían la nueva contraseña</strong></div><div class="settings-row"><span>Otras sesiones abiertas</span><strong>Cerradas en esta demo</strong></div><div class="settings-row"><span>Dispositivos de confianza</span><strong>Confianza revocada</strong></div><div class="settings-row"><span>MFA de la cuenta</span><span class="pill">Permanece activo</span></div><p>La sesión actual sigue abierta para mostrar el resultado. Los productos que todavía no están integrados conservan temporalmente sus credenciales antiguas.</p><div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:18px"><button class="btn-inline primary-inline" data-action="page" data-page="security">Volver a Seguridad</button><button class="btn-inline" data-action="page" data-page="home">Ir a mi plataforma</button></div></div><div class="devbox">En producción, invalidar sesiones y dispositivos depende de la política definida por Seguridad y de las capacidades del proveedor de identidad.</div></div>')}
function sessions(){return shell('<div class="page"><div class="eyebrow">Mi cuenta · Seguridad · Sesiones</div><h1>Sesiones y dispositivos</h1><p class="sub">Una vista central de los accesos de la cuenta, sin administrar los permisos de cada producto.</p><div class="panel"><h3>Dispositivos de confianza</h3><div class="settings-row"><span>Este dispositivo (demostración)</span><strong>'+(state.trust?'Confiable durante 30 días':'Sin confianza activa')+'</strong></div><button class="btn-inline" data-action="revokeTrust" '+(!state.trust?'disabled':'')+'>Revocar confianza del dispositivo</button></div><div class="panel"><h3>Otras sesiones</h3><div class="settings-row"><span>Sesiones de ejemplo, distintas de la actual</span><strong>'+(state.sessionsClosed?'Cerradas':'2 activas (ficticias)')+'</strong></div><button class="btn-inline primary-inline" data-action="closeOtherSessions" '+(state.sessionsClosed?'disabled':'')+'>Cerrar otras sesiones</button></div><div class="devbox">Los registros son ficticios. En la implementación real, la visibilidad y revocación de sesiones dependen de los sistemas de identidad y sus políticas.</div><button class="btn-inline" style="margin-top:18px" data-action="page" data-page="security">← Volver a Seguridad</button></div>')}
function securityMfa(){return shell('<div class="page"><div class="eyebrow">Mi cuenta · Seguridad · MFA</div><h1>Verificar segundo factor</h1><p class="sub">Prueba aislada del segundo factor, sin reiniciar el proceso de ingreso ni volver a aceptar términos.</p><div class="panel"><p>Introduce el código ficticio <strong>482915</strong>.</p><label class="field" for="securityotp">Código de verificación</label><input class="text-input code" id="securityotp" maxlength="6" inputmode="numeric" autocomplete="off" placeholder="••••••"><div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap"><button class="btn-inline primary-inline" data-action="finishSecurityMfa">Verificar</button><button class="btn-inline" data-action="page" data-page="security">Cancelar</button></div></div></div>')}
function render(){const outputs={login,migrate,contactVerification,recovery,mfa,consent,home,products,security,account,product,changePassword,changePasswordMfa,passwordChanged,sessions,securityMfa,...extra.screens,...identity.screens};app.innerHTML=(outputs[state.screen]||login)();attach();}
function attach(){const form=document.querySelector('#loginform');if(form)form.addEventListener('submit',e=>{e.preventDefault();state.email=document.querySelector('#email').value.trim();if(!state.email)return toast('Ingresa un correo válido para continuar.');setScreen(identity.startLogin())});const migration=document.querySelector('#migrateform');if(migration)migration.addEventListener('submit',e=>{e.preventDefault();state.rut=document.querySelector('#rut').value.trim();state.email=document.querySelector('#newemail').value.trim();if(!state.rut||!state.email)return toast('Completa RUT y correo para continuar.');state.migrating=true;setScreen('contactVerification')});document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',e=>{const a=el.dataset.action;if(identity.handle(a,el))return;
if(a==='rut')setScreen('migrate');else if(a==='login')setScreen('login');else if(a==='recover'||a==='noaccess')setScreen('recovery');else if(a==='resend')toast('Código simulado reenviado. Para esta demo utiliza 482915.');else if(a==='support')toast('Solicitud de recuperación simulada. En producción requeriría validación segura.');else if(a==='verifycontact'){if((document.getElementById('emailcode')?.value||'')!=='482915')toast('Usa el código de demostración 482915.');else{setScreen('ownership');toast('Correo nuevo verificado. Falta confirmar titularidad de la cuenta anterior.')}}
else if(a==='verifymfa'){if((document.getElementById('otp')?.value||'')!=='482915')toast('Usa el código de demostración 482915.');else{state.trust=!!document.getElementById('trust').checked;setScreen('consent')}}
else if(a==='accept'){state.agree1=!!document.getElementById('consent1').checked;state.agree2=!!document.getElementById('consent2').checked;if(!state.agree1||!state.agree2)toast('Acepta ambos documentos para continuar con la demo.');else{state.consented=true;setScreen('home')}}
else if(a==='companymenu'){state.menuOpen=!state.menuOpen;render()}else if(a==='company'){state.company=Number(el.dataset.index);setScreen('home')}
else if(a==='page')setScreen(el.dataset.page);else if(a==='product'){state.chosenProduct=el.dataset.code;setScreen('product')}
else if(a==='changePassword')setScreen('changePassword');else if(a==='startPasswordMfa')setScreen('changePasswordMfa');else if(a==='finishPasswordChange'){if((document.getElementById('pwotp')?.value||'')!=='482915')toast('Para esta demo utiliza el código 482915.');else{state.passwordChanged=true;state.sessionsClosed=true;state.trust=false;setScreen('passwordChanged')}}else if(a==='sessions')setScreen('sessions');else if(a==='revokeTrust'){state.trust=false;setScreen('sessions');toast('Confianza revocada en la simulación.')}else if(a==='closeOtherSessions'){state.sessionsClosed=true;setScreen('sessions');toast('Las otras sesiones ficticias quedaron cerradas.')}else if(a==='repeatmfa')setScreen('securityMfa');else if(a==='finishSecurityMfa'){if((document.getElementById('securityotp')?.value||'')!=='482915')toast('Para esta demo utiliza el código 482915.');else{setScreen('security');toast('Verificación MFA completada en la simulación.')}}else if(a==='logout'){setScreen('login')}
else if(extra.handle(a,el)){}else if(a==='none')toast('El contenido específico de este producto queda fuera del alcance del prototipo MFA.');
}));}
function reset(){state.screen='login';state.email='andres@empresa.cl';state.rut='';state.trust=false;state.agree1=false;state.agree2=false;state.company=0;state.chosenProduct='CO';state.menuOpen=false;state.migrating=false;state.passwordChanged=false;state.sessionsClosed=false;identity.reset();extra.reset();render()}
document.getElementById('reset').addEventListener('click',reset);render();
})();
</script>
</body>
</html>
